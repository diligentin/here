<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Strona główna</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: sans-serif;
  }

  .wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
  }

  .new-chapter {
    text-align: center;
    margin-bottom: 40px;
  }

  .new-chapter img {
    max-width: 720px;
    width: 100%;
    height: auto;
    cursor: pointer;
    border: 2px solid #444;
  }

  .titles-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    justify-items: center;
  }

  .title-card {
    width: 180px;
    height: 300px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #444;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 1100px) {
    .titles-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 700px) {
    .titles-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>
<div class="wrapper">

  <h1>Nowy rozdział</h1>
  <div class="new-chapter">
    <!-- PODMIEŃ LINKI: href do readera, src do okładki -->
    <a href="reader.html?comic=komiks1&chapter=5">
      <img src="LINK_DO_OKŁADKI_NOWEGO_ROZDZIAŁU.jpg" alt="Nowy rozdział">
    </a>
  </div>

  <h2>Wszystkie tytuły</h2>
  <div class="titles-grid">
    <!-- 12 przykładowych tytułów – podmień href i src -->

    </a>
    <a class="title-card" href="title.html?comic=komiks2">

    </a>
