   @font-face {

  font-weight: normal;
  font-style: normal;

/* ===== GLOBAL ===== */

body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family: figtree, sans-serif;
}

/* ===== HERO ===== */
.hero {
  display:flex;
  justify-content:center;
  padding:20px 0;
}
.hero img {
  width:200px;
}

/* ===== SEKCJA BLOKU ===== */

.section-block {
  width: min(100%, 1000px); /* kluczowa poprawka */
  margin: 0 auto;
  padding: 0 17px;
  box-sizing: border-box;
}

/* ===== TYTUŁ SEKCJI ===== */

.section-title-img {
  display: block;
  width: 250px;
  margin: 35px 0 20px 0;
}

/* ===== GRID ===== */

.auto-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  justify-content: center;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

/* odstęp pod gridem tytułów */
#titles-grid {
  margin-bottom: 30px;
}

/* ===== KARTY ===== */

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

.card img {
  transition: transform 0.25s ease, border-radius 0.25s ease;
}

.card:hover img {
  transform: scale(1.03);
}

/* MINIATURY 150×150 */
.card.square img {
  width: min(150px, 100%); /* dopóki się mieści = 150px, jak za mało miejsca = skaluje się */
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

/* OKŁADKI 150×270 */
.card.tall img {
  width: min(150px, 100%);
  aspect-ratio: 5 / 9;
  object-fit: cover;
}

/* ===== TELEFON ===== */

@media (max-width: 600px) {
  .auto-grid {
    grid-template-columns: repeat(3, 1fr);
    transform: scale(0.7);
  }

  .card img {
    width:120px;
    height:auto;
  }

  .section-title-img {
    width: 175px; /* 250px × 0.7 = 175px */
  }
}



</style>

<!-- ===== JS: OZNACZANIE PRZECZYTANYCH ROZDZIAŁÓW ===== -->
<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, window.location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) {
      card.classList.add("read");
    }
  }
});
</script>
