/* ===== GLOBAL ===== */

body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family: figtree, sans-serif;
}

/* ===== HERO ===== */
.hero {
  display:flex;
  justify-content:center;
  padding:15px 0;
}
.hero img {
  width:200px;
}

/* ===== SEKCJA BLOKU ===== */

.section-block {
  width: min(100%, 1000px);
  margin: 0 auto;
  padding: 0 9px; 
  box-sizing: border-box;
}

/* ===== TYTUŁ SEKCJI ===== */

.section-title-img {
  display: block;
  width: 100%;        /* skaluje się jak obrazki */
  max-width: 200px;   /* pełny rozmiar = 200px */
  margin: 35px 0 20px 0; /* zostaje jak było */
  height: auto;
}


/* ===== GRID ===== */

.auto-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 9px;
  justify-items: center;

  /* WYŚRODKOWANIE OSTATNIEGO RZĘDU */
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
}

}

#titles-grid-1 {
  margin-bottom: 13px; /* odstęp między gridami */
}

#titles-grid-2 {
  margin-bottom: 30px; /* odstęp pod całą sekcją */
}

/* ===== KARTY ===== */

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

.card img {
  transition: transform 0.25s ease, border-radius 0.25s ease;
}

.card:hover img {
  transform: scale(1.03);
}

/* MINIATURY 150×150 */
.card.square img {
  width: 100%;
  max-width: 150px;
  height: auto;
  border-radius: 2px
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

/* OKŁADKI 150×270 */
.card.tall img {
  width: 100%;
  max-width: 150px;
  height: auto;
  border-radius: 2px
  aspect-ratio: 5 / 9;
  object-fit: cover;
}

/* ===== TELEFON ===== */

@media (max-width: 600px) {
  .auto-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 9px;
  }

  .card img {
    width: 100%;
    height: auto;
  }

  .section-title-img {
    width: 58%;
    height: auto;
  }
}

<!-- ===== JS: OZNACZANIE PRZECZYTANYCH ROZDZIAŁÓW ===== -->
<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, window.location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) {
      card.classList.add("read");
    }
  }
});
</script>
