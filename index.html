<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Strona główna</title>

<style>
  body {
    margin: 0;
    background: #191818ff;
    color: #fff;
    font-family: Avenir Next W1G, sans-serif;
  }

  .wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  /* --- OBRAZEK: NOWY ROZDZIAŁ --- */
  .section-header {
    display: flex;
    justify-content: flex-start;
    padding-left: 15px;
    margin: 5px 0 5px 0;
  }

  .section-header img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    background: #191818ff;
    border: none;
  }

  /* --- GRID POD OBRAZKIEM NOWE ROZDZIAŁY --- */
  .new-chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    justify-items: center;
    margin-bottom: 15px;
  }

  .new-chapter-card {
    width: 170px;
    height: 170px;
    background: #191818ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
  }

  .new-chapter-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* --- GRID WSZYSTKIE TYTUŁY --- */
  .titles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    justify-items: center;
    margin-bottom: 15px;
  }

  .title-card {
    width: 170px;
    height: 300px;
    background: #191818ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
  }

  .title-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media(max-width: 700px) {
    .title-card {
      width: 150px;
      height: 260px;
    }
  }
</style>
</head>

<body>
<div class="wrapper">

  <!-- OBRAZEK: NOWY ROZDZIAŁ -->
  <div class="section-header">
    <img src="https://tajnachalupka.github.io/main/nowy.jpg" alt="">
  </div>

  <!-- GRID NOWYCH ROZDZIAŁÓW -->
  <div class="new-chapters-grid">

    <a class="new-chapter-card" href="reader.html?comic=afos&chapter=1">
      <img src="https://tajnachalupka.github.io/main/cov/!afos.jpg" alt="afos">
    </a>

    <a class="new-chapter-card" href="reader.html?comic=bbb&chapter=1">
      <img src="LINK_DO_NOWEGO_ROZDZIALU_2.jpg" alt="">
    </a>

    <!-- dodawaj kolejne -->

  </div>

  <!-- OBRAZEK: WSZYSTKIE TYTUŁY -->
  <div class="section-header">
    <img src="https://tajnachalupka.github.io/main/wszystkie.jpg" alt="">
  </div>

  <!-- GRID TYTUŁÓW -->
  <div class="titles-grid">

    <a class="title-card" href="tyt-afos.html?comic=afos">
      <img src="https://tajnachalupka.github.io/main/cov/!afos.jpg" alt="afos">
    </a>

    <a class="title-card" href="tyt-at.html?comic=at">
      <img src="https://tajnachalupka.github.io/main/cov/!at.jpg"></a>
    </a>

     <a class="title-card" href="tyt-bn.html?comic=bn">
      <img src="https://tajnachalupka.github.io/main/cov/!bn.jpg"></a>

      <a class="title-card" href="tyt-mp.html?comic=mp">
      <img src="https://tajnachalupka.github.io/main/cov/!mp.jpg"></a>

      <a class="title-card" href="tyt-bn.html?comic=bn">
      <img src="https://tajnachalupka.github.io/main/cov/!bn.jpg"></a>

      <a class="title-card" href="tyt-bn.html?comic=bn">
      <img src="https://tajnachalupka.github.io/main/cov/!bn.jpg"></a>

    
    <!-- dodawaj kolejne -->

  </div>

</div>
</body>
</html>
