<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Strona główna</title>
<style>
 body {
  margin: 0;
  background: #191818ff;
  color: #fff;
  font-family: Avenir Next W1G, sans-serif;
}

.wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

/* NOWOŚĆ — pełne wyśrodkowanie */
.new-chapter {
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
}

.new-chapter img {
  width: 200px;
  height: 200px;
  cursor: pointer;
  border: none;
  object-fit: cover;
}

/* GRID — wyśrodkowany, responsywny */
.titles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  justify-items: center;
}

/* Karta tytułu — bez ramek, wyśrodkowana */
.title-card {
  width: 200px;
  height: 350px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
}

.title-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Responsywność */
@media(max-width: 700px) {
  .title-card {
    width: 150px;
    height: 260px;
  }
}

</style>
</head>
<body>
<div class="wrapper">

  <h1>Nowy rozdział</h1>
  <div class="new-chapter">
    <a href="reader.html?comic=afos&chapter=1">
      <img src="https://tajnachalupka.github.io/main/cov/!afos.jpg" alt="Nowy rozdział afos">
    </a>
  </div>

  <h2>Wszystkie tytuły</h2>
  <div class="titles-grid">

    <!-- KOMIKS AAA -->
    <a class="title-card" href="tyt-afos.html">
      <img src="https://tajnachalupka.github.io/main/cov/!afos.jpg" alt="afos">
    </a>

    <!-- 11 kolejnych tytułów jako szablon -->
    <a class="title-card" href="tyt-at.html"><img src="https://tajnachalupka.github.io/main/cov/!at.jpg"></a>
    <a class="title-card" href="tyt-ccc.html"><img src="https://tajnachalupka.github.io/main/cov/!bn.jpg"></a>
    <a class="title-card" href="tyt-ddd.html"><img src="https://tajnachalupka.github.io/main/cov/!mp.jpg"></a>
    <a class="title-card" href="tyt-eee.html"><img src="https://tajnachalupka.github.io/main/cov/!mo.jpg"></a>
    <a class="title-card" href="tyt-fff.html"><img src="https://tajnachalupka.github.io/main/cov/!mnbig.jpg"></a>
    <a class="title-card" href="tyt-ggg.html"><img src="https://tajnachalupka.github.io/main/cov/!orta.jpg"></a>
    <a class="title-card" href="tyt-hhh.html"><img src="https://tajnachalupka.github.io/main/cov/!osd.jpg"></a>
    <a class="title-card" href="tyt-iii.html"><img src="https://tajnachalupka.github.io/main/cov/!rc.jpg"></a>
    <a class="title-card" href="tyt-jjj.html"><img src="https://tajnachalupka.github.io/main/cov/!sah.jpg"></a>
    <a class="title-card" href="tyt-kkk.html"><img src="https://tajnachalupka.github.io/main/cov/!ub.jpg"></a>
    <a class="title-card" href="tyt-lll.html"><img src="https://tajnachalupka.github.io/main/cov/!yiam.jpg"></a>

  </div>

</div>
</body>
</html>
