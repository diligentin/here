   @font-face {

  font-style: normal;
   }

    
body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family: figtree, sans-serif;
}

/* ===== HERO ===== */
.hero {
  display:flex;
  justify-content:center;
  padding:20px 0;
}
.hero img {
  width:300px;
  filter:drop-shadow(0 0 20px rgba(0,0,0,0.6));
}
.section-title-img {
  display:block;
  width:300px;
  margin: 35px auto 20px auto;
}

/* ===== NAGŁÓWKI ===== */
h1, h2 {
  margin:20px 16px 10px;
  font-size:30px;
  font-family: figtree, sans-serif;
}

/* ===== GRID ===== */
.auto-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 11px;
  width: calc(100% - 30px);
  max-width: 1200px;
  margin: 0 auto;
}


/* KARTA */
.card img {
  transition: filter 0.25s ease;
}

.card img {
  transition: transform 0.25s ease, border-radius 0.25s ease;
}

.card:hover img {
  transform: scale(1.03);
  border-radius: 14px; /* delikatna zmiana kształtu */
}

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

/* MINIATURY 170×170 */
.card.square img {
  width:150px;
  height:150px;
  object-fit:cover;
}

/* OKŁADKI 170×300 */
.card.tall img {
  width:150px;
  height:270px;
  object-fit:cover;
}


@media (max-width: 600px) {
  .auto-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;
     zoom: 0.7;

   
  }
}
</style>
</head>

<!-- ===== JS: OZNACZANIE PRZECZYTANYCH ROZDZIAŁÓW ===== -->
<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, window.location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) {
      card.classList.add("read");
    }
  }
});
</script>
