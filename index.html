<!DOCTYPE html>

<meta charset="UTF-8">
<title>tłumaczenia</title>

<style>
body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family:Avenir Next W1G, sans-serif;
}

/* ===== HERO ===== */
.hero {
  display:flex;
  justify-content:center;
  padding:20px 0;
}
.hero img {
  width:300px;
  filter:drop-shadow(0 0 20px rgba(0,0,0,0.6));
}
.section-title-img {
  display:block;
  width:300px;          /* rozmiar podobny do nagłówków */
   margin:20px 0 20px 16px; /* góra | prawo | dół | lewo */
  filter:drop-shadow(0 0 10px rgba(0,0,0,0.5));
}

/* ===== NAGŁÓWKI ===== */
h1, h2 {
  margin:20px 16px 10px;
  font-size:30px;
  font-family:PiekosToons BB;
}

/* ===== GRID ===== */
.grid {
  display:grid;
  gap:10px;
  justify-content:center;
  padding:0 16px;
}

/* Desktop: 4 w rzędzie */
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 1100px;
  margin: 0 auto;
}

/* Tablet: 2 w rzędzie */
@media (max-width: 900px) {
  .grid-4 {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}

/* Telefon: 1 w rzędzie */
@media (max-width: 600px) {
  .grid-4 {
    grid-template-columns: repeat(1, 1fr) !important;
  }
}


/* KARTA */
  .card img {
  transition: filter 0.25s ease;
}

.card:hover img {
  filter: brightness(0.75);
}

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

/* MINIATURY 170×170 */
.card.square img {
  width:170px;
  height:170px;
  object-fit:cover;
  border-radius:8px;
}

/* OKŁADKI 170×300 */
.card.tall img {
  width:170px;
  height:300px;
  object-fit:cover;
  border-radius:8px;
}
</style>
</head>

<body>
