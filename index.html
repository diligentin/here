<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strona główna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">

  <!-- Obrazek: NOWE ROZDZIAŁY -->
  <div class="section-header">
    <img src="img/nowe-rozdzialy.png" alt="Nowe rozdziały">
  </div>

  <div class="new-chapters-grid">
    <!-- Przykłady – podmienisz na swoje -->
    <a class="new-chapter-card" href="reader.html?comic=aaa&chapter=1">
      <img src="img/aaa-ch1-thumb.jpg" alt="">
    </a>
    <a class="new-chapter-card" href="reader.html?comic=aaa&chapter=2">
      <img src="img/aaa-ch2-thumb.jpg" alt="">
    </a>
  </div>

  <!-- Obrazek: WSZYSTKIE TYTUŁY -->
  <div class="section-header">
    <img src="img/wszystkie-tytuly.png" alt="Wszystkie tytuły">
  </div>

  <div class="titles-grid">
    <!-- 12 tytułów – przykładowo -->
    <a class="title-card" href="tyt.html?comic=aaa">
      <img src="img/aaa-cover.jpg" alt="AAA">
    </a>
    <a class="title-card" href="tyt.html?comic=aab">
      <img src="img/aab-cover.jpg" alt="AAB">
    </a>
    <!-- ...do 12 -->
  </div>

</div>
</body>
</html>
