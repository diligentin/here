<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Strona główna</title>

<style>
  body {
    margin: 0;
    background: #191818ff;
    color: #fff;
    font-family: Avenir Next W1G, sans-serif;
  }

  .wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  /* --- OBRAZEK: NOWY ROZDZIAŁ --- */
  .new-chapter {
    display: flex;
    justify-content: flex-start;
    padding-left: 15px;
    margin-bottom: 40px;
  }

  .new-chapter img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    background: #111;
    border: none;
    cursor: pointer;
  }

  /* --- OBRAZEK: WSZYSTKIE TYTUŁY --- */
  .all-titles {
    display: flex;
    justify-content: flex-start;
    padding-left: 15px;
    margin-bottom: 20px;
  }

  .all-titles img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    background: #111;
    border: none;
    cursor: pointer;
  }

  /* --- GRID TYTUŁÓW --- */
  .titles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    justify-items: start;
    padding-left: 15px;
  }

  .title-card {
    width: 200px;
    height: 350px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
  }

  .title-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media(max-width: 700px) {
    .title-card {
      width: 150px;
      height: 260px;
    }
  }
</style>
</head>

<body>
<div class="wrapper">

  <!-- OBRAZEK: NOWY ROZDZIAŁ -->
  <div class="new-chapter">
    <img src="LINK_DO_OBRAZKA_NOWY_ROZDZIAL.png" alt="">

  <!-- OBRAZEK: WSZYSTKIE TYTUŁY -->
  <div class="all-titles">

  </div>

  <!-- GRID TYTUŁÓW -->
