  h1,h2 { text-align:center; }

  .new-chapter { text-align:center; margin-bottom:40px; }
  .new-chapter img {
    width:200px; height:200px; cursor:pointer; border:0px solid #444;
  }

  .titles-grid {
    display:grid; grid-template-columns:repeat(6,1fr);
    gap:15px; justify-items:center;
  }
  .title-card {
    width:200px; height:320px; overflow:hidden; cursor:pointer;
    border:1px solid #444; background:#111; display:flex; align-items:center; justify-content:center;
  }
  .title-card img { width:100%; height:100%; object-fit:cover; }

  @media(max-width:1100px){ .titles-grid{ grid-template-columns:repeat(3,1fr);} }
  @media(max-width:700px){ .titles-grid{ grid-template-columns:repeat(2,1fr);} }
</style>
