<style>
body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family:Avenir Next W1G, sans-serif;
}

/* ===== HERO ===== */
.hero {
  display:flex;
  justify-content:center;
  padding:20px 0;
}
.hero img {
  width:300px;
  filter:drop-shadow(0 0 20px rgba(0,0,0,0.6));
}
.section-title-img {
  display:block;
  width:300px;
  margin: 20px 0 20px 16px;
}

/* ===== NAGŁÓWKI ===== */
h1, h2 {
  margin:20px 16px 10px;
  font-size:30px;
  font-family:PiekosToons BB;
}

/* ===== GRID ===== */
.auto-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

/* KARTA */
.card img {
  transition: filter 0.25s ease;
}

.card:hover img {
  filter: brightness(0.75);
}

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

/* MINIATURY 170×170 */
.card.square img {
  width:170px;
  height:170px;
  object-fit:cover;
  border-radius:8px;
}

/* OKŁADKI 170×300 */
.card.tall img {
  width:170px;
  height:300px;
  object-fit:cover;
  border-radius:8px;
}

/* ===== PRZECZYTANE ROZDZIAŁY ===== */
.card.read img {
  filter: brightness(0.4) saturate(0.8);
  border: 3px solid #00ff88;
  border-radius: 8px;
}

@media (max-width: 600px) {
  body {
    zoom: 0.7;
  }
}
</style>
</head>

<!-- ===== JS: OZNACZANIE PRZECZYTANYCH ROZDZIAŁÓW ===== -->
<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, window.location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) {
      card.classList.add("read");
    }
  }
});
</script>
