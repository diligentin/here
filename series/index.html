<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
const parts = location.pathname.split("/").filter(Boolean);

// Dla Twojej strony parts wygląda tak:
// ["here", "series", "afos"] lub ["here", "series", "afos", "1"]

const slug = parts[2];
const chapter = parts[3];

if (!slug) {
  document.body.innerHTML = "<h2>Brak slugu serii</h2>";
} else if (chapter) {
  location.href = `/here/reader.html?comic=${slug}&chapter=${chapter}`;
} else {
  location.href = `/here/series.html?title=${slug}`;
}
</script>
</body>
</html>
