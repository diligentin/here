<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>afos</title>

<style>

  @font-face {
  font-family: "figtree";
  src: url("https://tajnachalupka.github.io/main/Figtree.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
    @font-face {
  font-family: "grapenuts";
  src: url("https://tajnachalupka.github.io/main/GrapeNuts.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

}

/* ===== RESET / BAZA ===== */
body {
  margin: 0;
  background: #191818ff;
  color: white;
  font-family: figtree; sans-serif;
}
a { color: white; text-decoration: none; }

/* HOME BUTTON NA DOLE */
.back {
  display: block;
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 20;
}
.back img {
  width: 50px;
  height: auto;
}

/* ===== NOWY UKŁAD COVER + INFO ===== */
.comic-layout {
  display: flex;
  gap: 32px;
  padding: 40px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

.cover {
  width: 100%;
  max-width: 299px;
  display: block;
}

.comic-info {
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
}

/* TYTUŁ */
.comic-title {
  font-size: 40px;
  text-align: center;
  margin-bottom: 5px;
}

/* TAGI */
.comic-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.comic-tags span {
  font-family: "grapenuts"; sans-serif;
  font-size: 26px;
  color: white;
  letter-spacing: 0.3px;
}


/* OPIS */
.comic-desc {
  font-size: 17px;
  color: #e0e0e0;
  line-height: 1.3;
  text-align: justify;
}

/* ===== SEKCJA ===== */
.section { padding: 24px 16px; }
.section h2 { font-size: 30px; font-weight: 200; margin-bottom: 50px; }

/* ===== SIATKA ROZDZIAŁÓW ===== */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(10, 42px);
  gap: 12px;
  justify-content: center;
  padding-bottom: 40px;
}

.chapter-btn {
  width: 42px;
  height: 42px;
  background: #1c1c1c;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 200;
  transition: 0.2s;
}

.chapter-btn:hover {
  background: #2a2a2a;
}

/* ===== PRZECZYTANE ROZDZIAŁY — TYLKO KOLOR NUMERU ===== */
.chapter-btn.visited {
  background: #1c1c1c;
  color: #8394F4;
  font-weight: 200;
}

@media (max-width: 600px) {
  body { zoom: 0.7; }
}
</style>
</head>

<body>

<!-- HOME BUTTON -->
<a class="back" href="https://diligentin.github.io/here">
  <img src="https://tajnachalupka.github.io/main/domek.png" alt="">
</a>

<!-- NOWY UKŁAD -->
<div class="comic-layout">
  <img class="cover" id="cover" src="" alt="">
  <div class="comic-info">
      <div class="comic-title" id="title"></div>
      <div class="comic-tags" id="tags"></div>
      <p class="comic-desc" id="desc"></p>
  </div>
</div>

<!-- ROZDZIAŁY -->
<div class="section">
  <h2>Rozdziały</h2>
  <div class="chapter-grid" id="chapters"></div>
</div>

<div class="padlet-embed" style="border:1px solid rgba(0,0,0,0.1);border-radius:2px;box-sizing:border-box;overflow:hidden;position:relative;width:100%;background:#F4F4F4">
  <p style="padding:0;margin:0">
    <iframe src="https://padlet.com/embed/ml339n7v5mkqpdpg" frameborder="0" style="width:100%;height:608px;display:block;padding:0;margin:0"></iframe>
  </p>
</div>

<script>
(async function() {
  const comicKey = "afos";
  const jsonUrl = `${comicKey}.json`;

  const res = await fetch(jsonUrl);
  const data = await res.json();

  // Ustaw cover, desc, tagi, tytuł
  document.getElementById("cover").src = data.cover;
  document.getElementById("title").innerText = data.title;
  document.getElementById("desc").innerHTML = data.desc.replace(/\n/g, "<br>");
  document.getElementById("tags").innerHTML = data.tags.map(t => `<span>${t}</span>`).join("");

  // ===== AUTOMATYCZNE GENEROWANIE ROZDZIAŁÓW =====
  const chapters = document.getElementById("chapters");

  if (data.chapters && typeof data.chapters === "object") {
    const chapterNumbers = Object.keys(data.chapters)
      .map(n => Number(n))
      .filter(n => !isNaN(n))
      .sort((a, b) => a - b);

    chapterNumbers.forEach(num => {
      const a = document.createElement("a");
      a.href = `reader.html?comic=${comicKey}&chapter=${num}`;

      const btn = document.createElement("div");
      btn.className = "chapter-btn";
      btn.innerText = num;

      if (localStorage.getItem(`read_${comicKey}_${num}`) === "1") {
        btn.classList.add("visited");
      }

      a.appendChild(btn);
      chapters.appendChild(a);
    });
  }

})();
</script>

</body>
</html>
