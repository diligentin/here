<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>a first of summers</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== RESET / BAZA ===== */
body {
  margin: 0;
  background: #191818ff;
  color: white;
  font-family: Avenir Next W1G, sans-serif;
}
a { color: white; text-decoration: none; }
.back { display: block; padding: 50px; font-size: 30px; }
.cover { width: 100%; max-width: 299px; margin: 0 auto; display: block; border-radius: 12px; }
.section { padding: 24px 16px; }
.section h2 { font-size: 30px; font-weight: 600; margin-bottom: 50px; }
.chapter-list { list-style: none; padding: 0; margin: 0; }
.chapter-list li { margin-bottom: 18px; }
.chapter-list a {
  display: block;
  background: #1c1c1c;
  padding: 18px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 600;
}
.chapter-list a:active { background: #2a2a2a; }
.comic-tags { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.comic-tags span {
  font-family: PiekosToons BB;
  font-size: 32px;
  padding: 6px 14px;
  border-radius: 999px;
  background: ;
  color: #bbb;
  letter-spacing: 0.4px;
}
.comic-desc { font-family: Avenir Next W1G, sans-serif; font-size: 20px; color: #e0e0e0; line-height: 1.2; max-width: 720px; letter-spacing: 0.3px; }
.comic-desc-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 30vh;
  padding: 0 5px;
  text-align: center;
}
</style>
</head>

<body>

<a class="back" href="index.html"> <img src="https://tajnachalupka.github.io/main/home.png" alt=""></a>

<img class="cover" id="cover" src="" alt="">

<div class="comic-tags" id="tags"></div>

<div class="comic-desc-container">
  <p class="comic-desc" id="desc"></p>
</div>

<div class="section">
  <h2>Rozdziały</h2>
    <ul class="chapter-list" id="chapters">
  <li><a href="reader.html?comic=afos&chapter=1">1</a></li>
      <li><a href="reader.html?comic=afos&chapter=2">2</a></li>
      <li><a href="reader.html?comic=afos&chapter=3">3</a></li>
      <li><a href="reader.html?comic=afos&chapter=4">4</a></li>
      <li><a href="reader.html?comic=afos&chapter=5">5</a></li>
      <li><a href="reader.html?comic=afos&chapter=6">6</a></li>
</ul>

</div>

<script>
(async function() {
  // nazwa pliku JSON
  const comicKey = "afos";
  const jsonUrl = `${comicKey}.json`; // jeśli JSON jest w tym samym folderze

  const res = await fetch(jsonUrl);
  const data = await res.json();

  // Ustaw cover, desc, tagi
  document.getElementById("cover").src = data.cover;
  document.getElementById("cover").alt = comicKey;

  document.getElementById("desc").innerText = data.desc;

  document.getElementById("tags").innerHTML = data.tags
    .map(t => `<span>${t}</span>`)
    .join("");
})();
</script>

</body>
</html>
