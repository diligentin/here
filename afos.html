<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>a first of summers</title>

<style>
/* ===== RESET / BAZA ===== */
body {
  margin: 0;
  background: #191818ff;
  color: white;
  font-family: Avenir Next W1G, sans-serif;
}
a { color: white; text-decoration: none; }
.back { display: block; padding: 50px; font-size: 30px; }

/* ===== NOWY UKŁAD COVER + INFO ===== */
.comic-layout {
  display: flex;
  gap: 32px;
  padding: 40px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

.cover {
  width: 100%;
  max-width: 299px;
  border-radius: 12px;
  display: block;
}

.comic-info {
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* TAGI */
.comic-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.comic-tags span {
  font-family: PiekosToons BB;
  font-size: 32px;
  padding: 6px 14px;
  border-radius: 999px;
  background: ;
  color: #bbb;
   align-items: center;
  justify-content: center;
  letter-spacing: 0.4px;
}

/* OPIS */
.comic-desc {
  font-family: Avenir Next W1G, sans-serif;
  font-size: 20px;
  color: #e0e0e0;
  line-height: 1.3;
  letter-spacing: 0.3px;
   align-items: center;
  justify-content: center;
}

/* ===== SEKCJA ===== */
.section { padding: 24px 16px; }
.section h2 { font-size: 30px; font-weight: 600; margin-bottom: 50px; }

/* ===== NOWA SIATKA ROZDZIAŁÓW ===== */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(10, 42px);
  gap: 12px;
  justify-content: center;
  padding-bottom: 40px;
}

.chapter-btn {
  width: 42px;
  height: 42px;
  background: #1c1c1c;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  transition: 0.2s;
}

.chapter-btn:hover {
  background: #2a2a2a;
}

.chapter-btn.visited {
  background: #8394F4;
  color: black;
}
</style>
</head>

<body>

<a class="back" href="index.html">
  <img src="https://tajnachalupka.github.io/main/home.png" alt="">
</a>

<!-- NOWY UKŁAD -->
<div class="comic-layout">
  
  <img class="cover" id="cover" src="" alt="">

  <div class="comic-info">
      <div class="comic-tags" id="tags"></div>
      <p class="comic-desc" id="desc"></p>
  </div>

</div>

<!-- ROZDZIAŁY -->
<div class="section">
  <h2>Rozdziały</h2>
  <div class="chapter-grid" id="chapters"></div>
</div>

<script>
(async function() {
  const comicKey = "afos";
  const jsonUrl = `${comicKey}.json`;

  const res = await fetch(jsonUrl);
  const data = await res.json();

  // Ustaw cover, desc, tagi
  document.getElementById("cover").src = data.cover;
  document.getElementById("cover").alt = comicKey;

  document.getElementById("desc").innerText = data.desc;

  document.getElementById("tags").innerHTML = data.tags
    .map(t => `<span>${t}</span>`)
    .join("");

  // GENEROWANIE ROZDZIAŁÓW
  const chapters = document.getElementById("chapters");
  const total = data.totalChapters || 6; // możesz wpisać na stałe

  for (let num = 1; num <= total; num++) {
    const a = document.createElement("a");
    a.href = `reader.html?comic=${comicKey}&chapter=${num}`;

    const btn = document.createElement("div");
    btn.className = "chapter-btn";
    btn.innerText = num;

    if (localStorage.getItem(`visited_${comicKey}_${num}`)) {
      btn.classList.add("visited");
    }

    a.appendChild(btn);
    chapters.appendChild(a);
  }
})();
</script>

</body>
</html>
