<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter"); // nie Number() tutaj

  const container = document.getElementById("comic-container");

  // ===== HOME BUTTON (działa zawsze) =====
  document.getElementById("homeBtn").onclick = () => {
    window.location.href = "index.html";
  };

  // ===== WALIDACJA PARAMETRÓW =====
  if (!comicKey || !chapter) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    document.getElementById("nextBtn").style.display = "none";
    return;
  }

  try {
    const res = await fetch(`${comicKey}.json`);
    if (!res.ok) throw new Error("Nie znaleziono JSON");

    const data = await res.json();
    const pages = data.chapters[chapter];

    // ===== jeśli chapter nie istnieje =====
    if (!pages) {
      container.innerHTML =
        "<p style='color:white;text-align:center;padding:50px;'>Ten rozdział nie istnieje.</p>";
      document.getElementById("nextBtn").style.display = "none";
      return;
    }

    // ===== ŁADOWANIE OBRAZÓW =====
    pages.forEach((src, index) => {
      const img = document.createElement("img");

      let attempts = 0;
      const loadImage = () => {
        img.src = src + (attempts > 0 ? `?retry=${attempts}` : "");
      };

      img.onerror = () => {
        attempts++;
        if (attempts < 3) loadImage();
        else {
          img.style.opacity = "0.4";
          img.style.border = "2px solid red";
          img.alt = "Błąd ładowania";
        }
      };

      if (index !== 0) img.loading = "lazy";
      loadImage();
      container.appendChild(img);
    });

    // ===== NEXT BUTTON =====
    const nextBtn = document.getElementById("nextBtn");
    const total = Object.keys(data.chapters).length;

    if (Number(chapter) < total) {
      nextBtn.onclick = () => {
        window.location.href = `reader.html?comic=${comicKey}&chapter=${Number(chapter) + 1}`;
      };
    } else {
      nextBtn.style.display = "none";
    }

  } catch (err) {
    console.error(err);
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Błąd wczytywania pliku JSON.</p>";
    document.getElementById("nextBtn").style.display = "none";
  }

})();
</script>
