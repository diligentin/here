<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>...</title>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">

<style>
body { margin:0; background:#191818; }

/* KOMIKS */
#comic-container {
  max-width:720px;
  margin:0 auto;
}
#comic-container img {
  width:100%;
  height:auto;
  display:block;
  image-rendering:-webkit-optimize-contrast;
  object-fit:contain;
}

/* PRZYCISKI */
.nav-buttons {
  position:fixed; bottom:20px; left:20px;
  display:flex; flex-direction:column; gap:10px;
  transition:opacity .3s; opacity:1;
}
.nav-buttons.hidden { opacity:0; pointer-events:none; }
.nav-btn { width:60px; height:60px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.btn-icon { width:42px; height:42px; filter:invert(1); }

/* REAKCJE */
#reactions { padding:20px; text-align:center; color:white; }
.reaction-row { display:flex; justify-content:center; gap:4px; }
.react { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.react img { width:70px; height:70px; object-fit:contain; }
.react.clicked { animation:pulse .3s; }
@keyframes pulse { 50% { transform:scale(1.1); } }

/* DISQUS */
#disqus_thread { margin-top:40px; padding:20px; background:#111; }
</style>
</head>
<body>

<div id="comic-container"></div>

<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img class="btn-icon" src="https://tajnachalupka.github.io/main/szczala-next.png"></div>
  <div class="nav-btn" id="prevBtn"><img class="btn-icon" src="https://tajnachalupka.github.io/main/szczala-prev.png"></div>
  <div class="nav-btn" id="homeBtn"><img class="btn-icon" src="https://tajnachalupka.github.io/main/domek.png"></div>
</div>

<div id="reactions">
  <div class="reaction-row">
    <div class="react" data-id="1"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r1.jpg"><div class="count">0</div></div>
    <div class="react" data-id="2"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r2.jpg"><div class="count">0</div></div>
    <div class="react" data-id="3"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r3.jpg"><div class="count">0</div></div>
    <div class="react" data-id="4"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r4.jpg"><div class="count">0</div></div>
    <div class="react" data-id="5"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r5.jpg"><div class="count">0</div></div>
  </div>
</div>

<div id="disqus_thread"></div>

<script>
let CK = null, CH = null;

/* ===== READER ===== */
(async () => {
  const p = new URLSearchParams(location.search);
  CK = p.get("comic");
  CH = p.get("chapter");

  const box = document.getElementById("comic-container");

  if (!CK || !CH) {
    box.innerHTML = "<p style='color:white;text-align:center;padding:40px;'>Brak danych.</p>";
    return;
  }

  /* ŁADOWANIE JSON */
  const data = await (await fetch(`${CK}.json`)).json();
  const pages = data.chapters[CH];
  if (!pages) {
    box.innerHTML = "<p style='color:white;text-align:center;padding:40px;'>Rozdział nie istnieje.</p>";
    return;
  }

  /* ZAPIS HISTORII ODWIEDZIN */
  localStorage.setItem(`read_${CK}_${CH}`, "1");

  /* CIĘCIE */
  async function slice(src) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = src;
    await img.decode();

    const out = [];
    const H = 1600;
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    c.width = img.width;

    for (let y = 0; y < img.height; y += H) {
      const h = Math.min(H, img.height - y);
      c.height = h;
      ctx.drawImage(img, 0, y, img.width, h, 0, 0, img.width, h);
      out.push({ url: c.toDataURL("image/jpeg", 0.95), w: img.width, h });
    }
    return out;
  }

  /* WSTAWIANIE OBRAZÓW */
  for (const src of pages) {
    const slices = await slice(src);
    for (const s of slices) {
     const im = document.createElement("img");
im.style.width = s.w + "px";
im.style.height = s.h + "px";
im.src = s.url;   // ← dopiero TERAZ
box.appendChild(im);
 }
  } catch (err) {
    console.error("Slice error:", err);
    const p = document.createElement("p");
    p.style.color = "red";
    p.textContent = "Błąd ładowania obrazu.";
    box.appendChild(p);
    }
  }

  /* NEXT/PREV */
  const keys = Object.keys(data.chapters).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const i = keys.indexOf(CH);

  nextBtn.onclick = () => location.href = i < keys.length-1 ? `reader.html?comic=${CK}&chapter=${keys[i+1]}` : "https://diligentin.github.io/here";
  prevBtn.onclick = () => location.href = i > 0 ? `reader.html?comic=${CK}&chapter=${keys[i-1]}` : "https://diligentin.github.io/here";
  homeBtn.onclick = () => location.href = "https://diligentin.github.io/here";
})();

/* ===== AUTO-HIDE ===== */
let last = 0;
addEventListener("scroll", () => {
  nav.classList.toggle("hidden", scrollY > last);
  last = scrollY;
});

/* ===== REACTIONS ===== */
document.querySelectorAll(".react").forEach(r => {
  r.onclick = () => {
    const id = r.dataset.id;
    if (localStorage[`react_${id}`]) return;
    localStorage[`react_${id}`] = 1;
    r.classList.add("clicked");
    r.querySelector(".count").textContent++;
  };
});

/* ===== DISQUS ===== */
const disqusMap = {
  "afos:2": "https://tajnachalupka.wixsite.com/ub-1/ub25",
  "afos:2♡": "https://tajnachalupka.wixsite.com/ub-1/ub24"
};

function loadDisqusNow() {
  var d = document, s = d.createElement('script');
  s.src = 'https://chalupka-ruoye-chan-wix.disqus.com/embed.js';
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
}

var disqus_config = function () {
  const key = `${CK}:${CH}`;
  this.page.url = location.href;
  this.page.identifier = disqusMap[key] || `${CK}-${CH}`;
};

/* ŁADUJEMY DISQUS DOPIERO PO USTAWIENIU CK I CH */
new IntersectionObserver(e => {
  if (e[0].isIntersecting && CK && CH) {
    loadDisqusNow();
  }
}, { threshold: 0.1 }).observe(document.getElementById("disqus_thread"));

</script>

</body>
</html>
