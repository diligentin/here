<style>
body {
  margin: 0;
  background: #191818ff;
}
#comic-container {
  max-width: 720px;
  margin: 0 auto;
}
/* obrazki */
img {
 width: 100%;
  height: auto;
  display: block;
  max-width: 720px;
  aspect-ratio: auto;
  image-rendering: -webkit-optimize-contrast;
  object-fit: contain;
}

@media (max-width: 800px) {
  img {
    max-width: 100% !important;
    margin: 0;
  }
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: opacity 0.3s ease;
  opacity: 1;
}

.nav-buttons.hidden {
  opacity: 0;
  pointer-events: none;
}

.nav-btn {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

/* ikony w przyciskach */
.btn-icon {
  width: 42px;
  height: 42px;
  pointer-events: none;
  filter: invert(1);
}

/* ===== REACTIONS ===== */
#reactions {
  padding: 25px 10px 15px;
  text-align: center;
  color: white;
}

.reaction-row {
  display: flex;
  justify-content: center;
  gap: 2px;
  flex-wrap: nowrap;
}

.react img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 2px;

  /* zapobiega ściskaniu */
  flex-shrink: 0;

  /* minimalny rozmiar na telefonach */
  min-width: 60px;
  min-height: 60px;

  /* skalowanie na mniejszych ekranach */
  max-width: 16vw;
  max-height: 16vw;
}

.react {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.15s ease;
   border-radius: 2px;
}

.react .count {
  margin-top: 4px;
  font-size: 14px;
  color: #ddd;
}

/* animacja pulsowania */
.react.clicked {
  animation: pulse 0.35s ease;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* ===== DISQUS ===== */
#disqus_thread {
  padding: 20px;
  background: #111;
  margin-top: 40px;
}
</style>
</head>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");

  const container = document.getElementById("comic-container");

  document.getElementById("homeBtn").onclick = () => {
    window.location.href = "https://diligentin.github.io/here";
  };

  if (!comicKey || !chapter) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    document.getElementById("nextBtn").onclick = () => {
      window.location.href = "https://diligentin.github.io/here/";
    };
    return;
  }

  /* ===== CIĘCIE OBRAZÓW ===== */
  async function sliceImage(src, sliceHeight = 2000) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        try {
          const slices = [];
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;

          for (let y = 0; y < img.height; y += sliceHeight) {
            const h = Math.min(sliceHeight, img.height - y);
            canvas.height = h;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, y, img.width, h, 0, 0, img.width, h);

            slices.push({
              url: canvas.toDataURL("image/jpeg", 0.95),
              w: canvas.width,
              h: canvas.height
            });
          }

          resolve(slices);
        } catch (e) {
          reject(e);
        }
      };

      img.onerror = () => reject();
    });
  }

  try {
    const res = await fetch(`${comicKey}.json`);
    const data = await res.json();
    const pages = data.chapters[chapter];

    if (!pages) {
      container.innerHTML =
        "<p style='color:white;text-align:center;padding:50px;'>Ten rozdział nie istnieje.</p>";
      return;
    }

    const loadingInfo = document.createElement("p");
    loadingInfo.style.color = "white";
    loadingInfo.style.textAlign = "center";
    loadingInfo.style.padding = "20px";
    loadingInfo.textContent = "Ładowanie rozdziału...";
    container.appendChild(loadingInfo);

    for (const src of pages) {
      try {
        const slices = await sliceImage(src, 2000);
        slices.forEach(slice => {
          const img = document.createElement("img");
          img.src = slice.url;
          img.loading = "lazy";

          /* ⭐ KLUCZOWE — NAPRAWIA ROZCIĄGANIE NA TABLETACH */
          img.width = slice.w;
          img.height = slice.h;

          container.appendChild(img);
        });
      } catch {
        const errP = document.createElement("p");
        errP.style.color = "red";
        errP.style.textAlign = "center";
        errP.style.padding = "10px";
        errP.textContent = "Błąd ładowania strony.";
        container.appendChild(errP);
      }
    }

    loadingInfo.remove();
