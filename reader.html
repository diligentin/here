<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Reader</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
  }

  img.page {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
  }

  #comic-container {
    max-width: 100vw;
    overflow-x: hidden;
  }

  /* ===== REAKCJE ===== */
  #reactions {
    margin: 40px auto;
    padding: 20px;
    text-align: center;
    background: #111;
    border-top: 1px solid #333;
  }

  .reaction-btn {
    font-size: 32px;
    margin: 0 10px;
    cursor: pointer;
    transition: transform .15s;
  }

  .reaction-btn:hover {
    transform: scale(1.25);
  }

  .reaction-count {
    font-size: 14px;
    color: #aaa;
    display: block;
  }

  /* ===== DISQUS ===== */
  #comments {
    margin: 40px auto;
    padding: 20px;
    background: #111;
    border-top: 1px solid #333;
  }
</style>
</head>
<body>

<div id="comic-container"></div>

<!-- ===== REAKCJE ===== -->
<div id="reactions">
  <h3>Twoja reakcja</h3>
  <div id="reaction-buttons"></div>
</div>

<!-- ===== KOMENTARZE DISQUS ===== -->
<div id="comments">
  <h3>Komentarze</h3>
  <div id="disqus_thread"></div>
</div>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");

  const container = document.getElementById("comic-container");

  if (!comicKey || !chapter) {
    container.innerHTML =
      "<p style='text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    return;
  }

  // ====== POBIERANIE JSON ======
  let data;
  try {
    const res = await fetch(`${comicKey}.json`);
    if (!res.ok) throw new Error("Nie znaleziono JSON");
    data = await res.json();
  } catch (err) {
    container.innerHTML =
      "<p style='text-align:center;padding:50px;'>Błąd wczytywania JSON.</p>";
    return;
  }

  const pages = data.chapters[String(chapter)];
  if (!pages || pages.length === 0) {
    container.innerHTML =
      "<p style='text-align:center;padding:50px;'>Brak obrazków dla tego rozdziału.</p>";
    return;
  }

  // ====== TWORZENIE OBRAZÓW (bez src na start) ======
  const imgElements = pages.map((src) => {
    const img = document.createElement("img");
    img.className = "page";
    img.dataset.src = src;
    img.decoding = "async";
    img.loading = "lazy";
    return img;
  });

  imgElements.forEach(img => container.appendChild(img));

  // ====== OBSERWATOR ŁADOWANIA (preload 1000px) ======
  const preloadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        if (!img.src) img.src = img.dataset.src;
      }
    });
  }, {
    rootMargin: "1000px 0px 1000px 0px"
  });

  imgElements.forEach(img => preloadObserver.observe(img));

  // ====== OBSERWATOR ODCIĄŻANIA RAM ======
  const unloadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) {
        const img = entry.target;
        if (img.src) img.src = "";
      }
    });
  }, {
    rootMargin: "-2000px 0px -2000px 0px"
  });

  imgElements.forEach(img => unloadObserver.observe(img));

  // ====== ZAPIS OSTATNIO CZYTANE ======
  const recent = JSON.parse(localStorage.getItem("recentComics")) || [];
  const idx = recent.indexOf(comicKey);
  if (idx !== -1) recent.splice(idx, 1);
  recent.unshift(comicKey);
  localStorage.setItem("recentComics", JSON.stringify(recent.slice(0, 5)));

  // ============================================================
  // ===================== REAKCJE ==============================
  // ============================================================

  const reactionTypes = ["👍", "❤️", "😂", "😮", "👎"];
  const reactionContainer = document.getElementById("reaction-buttons");

  const storageKey = `reactions_${comicKey}_${chapter}`;
  const savedReactions = JSON.parse(localStorage.getItem(storageKey)) || {
    "👍": 0, "❤️": 0, "😂": 0, "😮": 0, "👎": 0
  };

  function renderReactions() {
    reactionContainer.innerHTML = "";
    reactionTypes.forEach(type => {
      const btn = document.createElement("span");
      btn.className = "reaction-btn";
      btn.textContent = type;

      const count = document.createElement("span");
      count.className = "reaction-count";
      count.textContent = savedReactions[type];

      btn.onclick = () => {
        savedReactions[type]++;
        localStorage.setItem(storageKey, JSON.stringify(savedReactions));
        renderReactions();
      };

      const wrapper = document.createElement("span");
      wrapper.style.display = "inline-block";
      wrapper.style.margin = "0 10px";
      wrapper.appendChild(btn);
      wrapper.appendChild(count);

      reactionContainer.appendChild(wrapper);
    });
  }

  renderReactions();

})();
</script>

<!-- ============================================================
     ===================== DISQUS ================================
     ============================================================ -->

<script>
var disqus_config = function () {
  this.page.url = window.location.href;
  this.page.identifier = window.location.pathname + window.location.search;
};

(function() {
  var d = document, s = d.createElement('script');
  s.src = 'https://TWOJ-DISQUS-NICK.disqus.com/embed.js'; 
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
})();
</script>

</body>
</html>
