<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reader</title>

<style>
body {
  margin: 0;
  background: #191818ff;
}

/* obrazki */
img {
  display: block;
  width: 100%;
  max-width: 720px;
  height: auto;
  margin: 0 auto;
}

@media (max-width: 800px) {
  img {
    max-width: 100% !important;
    margin: 0;
  }
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: opacity 0.3s ease;
  opacity: 1;
}

.nav-buttons.hidden {
  opacity: 0;
  pointer-events: none;
}

.nav-btn {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

/* ikony w przyciskach */
.btn-icon {
  width: 42px;
  height: 42px;
  pointer-events: none;
  filter: invert(1);
}
</style>
</head>
<body>

<div id="comic-container"></div>

<!-- ===== FLOATING BUTTONS ===== -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="homeBtn">
    <img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon">
  </div>

  <div class="nav-btn" id="nextBtn">
    <img src="https://tajnachalupka.github.io/main/szczala.png" class="btn-icon">
  </div>
</div>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter"); // pełny string (emoji, spacje OK)

  const container = document.getElementById("comic-container");

  // ===== HOME BUTTON =====
  document.getElementById("homeBtn").onclick = () => {
    window.location.href = "https://diligentin.github.io/here";
  };

  // ===== WALIDACJA =====
  if (comicKey === null || chapter === null) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    document.getElementById("nextBtn").onclick = () => {
      window.location.href = "https://diligentin.github.io/here/";
    };
    return;
  }

  // ===== FUNKCJA: CIĘCIE JEDNEGO OBRAZU NA SEGMENTY =====
  async function sliceImage(src, sliceHeight = 2000) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        try {
          const slices = [];
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;

          for (let y = 0; y < img.height; y += sliceHeight) {
            const h = Math.min(sliceHeight, img.height - y);
            canvas.height = h;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, y, img.width, h, 0, 0, img.width, h);

            const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
            slices.push(dataUrl);
          }

          resolve(slices);
        } catch (e) {
          reject(e);
        }
      };

      img.onerror = () => {
        reject(new Error("Błąd ładowania obrazu: " + src));
      };
    });
  }

  try {
    const res = await fetch(`${comicKey}.json`);
    if (!res.ok) throw new Error("Nie znaleziono JSON");

    const data = await res.json();
    const pages = data.chapters[chapter]; // klucz 1:1

    // ===== jeśli chapter nie istnieje =====
    if (!pages) {
      container.innerHTML =
        "<p style='color:white;text-align:center;padding:50px;'>Ten rozdział nie istnieje.</p>";

      document.getElementById("nextBtn").onclick = () => {
        window.location.href = "https://diligentin.github.io/here/";
      };
      return;
    }

    // ===== INFO O ŁADOWANIU =====
    const loadingInfo = document.createElement("p");
    loadingInfo.style.color = "white";
    loadingInfo.style.textAlign = "center";
    loadingInfo.style.padding = "20px";
    loadingInfo.textContent = "Ładowanie rozdziału...";
    container.appendChild(loadingInfo);

    // ===== ŁADOWANIE I CIĘCIE OBRAZÓW =====
    for (const src of pages) {
      try {
        const slices = await sliceImage(src, 2000); // ~2000px wysokości na segment

        slices.forEach(sliceUrl => {
          const img = document.createElement("img");
          img.src = sliceUrl;
          img.loading = "lazy";
          container.appendChild(img);
        });
      } catch (e) {
        const errP = document.createElement("p");
        errP.style.color = "red";
        errP.style.textAlign = "center";
        errP.style.padding = "10px";
        errP.textContent = "Błąd ładowania strony.";
        container.appendChild(errP);
      }
    }

    loadingInfo.remove();

    // ===== ZAPIS PRZECZYTANEGO ROZDZIAŁU =====
    localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

    // ===== NEXT BUTTON — KOLEJNOŚĆ „PO LUDZKU” =====
    const nextBtn = document.getElementById("nextBtn");

    const keys = Object.keys(data.chapters);

    // sortowanie: najpierw po numerze z przodu, potem wersje typu "2♡", "3 2.s"
    keys.sort((a, b) => {
      const numA = parseInt(a, 10);
      const numB = parseInt(b, 10);
      const hasNumA = !isNaN(numA);
      const hasNumB = !isNaN(numB);

      if (hasNumA && hasNumB) {
        if (numA !== numB) return numA - numB;

        const extraA = a.replace(/^\d+/, "").trim();
        const extraB = b.replace(/^\d+/, "").trim();

        if (!extraA && extraB) return -1; // "2" przed "2♡"
        if (extraA && !extraB) return 1;  // "2♡" po "2"
        return a.localeCompare(b);
      }

      if (hasNumA && !hasNumB) return -1;
      if (!hasNumA && hasNumB) return 1;

      return a.localeCompare(b);
    });

    const index = keys.indexOf(chapter);

    if (index !== -1 && index < keys.length - 1) {
      nextBtn.onclick = () => {
        window.location.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index + 1])}`;
      };
    } else {
      nextBtn.onclick = () => {
        window.location.href = "https://diligentin.github.io/here";
      };
    }

  } catch (err) {
    console.error(err);
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Błąd wczytywania pliku JSON.</p>";

    document.getElementById("nextBtn").onclick = () => {
      window.location.href = "https://diligentin.github.io/here";
    };
  }

})();
  
// ===== AUTO-HIDE BUTTONS ON SCROLL =====
let lastScroll = 0;
const nav = document.getElementById("nav");

window.addEventListener("scroll", () => {
  const current = window.scrollY;

  if (current > lastScroll) {
    nav.classList.add("hidden");
  } else {
    nav.classList.remove("hidden");
  }

  lastScroll = current;
});
</script>

</body>
</html>
