<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reader</title>

<style>
body {
  margin: 0;
  background: #191818ff;
}

/* obrazki */
img {
  display: block;
  width: 100%;
  max-width: 720px;
  height: auto;
  margin: 0 auto;
}

@media (max-width: 800px) {
  img {
    max-width: 100% !important;
    margin: 0;
  }
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: opacity 0.3s ease;
  opacity: 1;
}

.nav-buttons.hidden {
  opacity: 0;
  pointer-events: none;
}

.nav-btn {
  width: 60px;
  height: 60px;
  background: #1c1c1c;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.nav-btn:hover {
  background: #2a2a2a;
}

/* ikony w przyciskach */
.btn-icon {
  width: 32px;
  height: 32px;
  pointer-events: none;
  filter: invert(1); /* usuń jeśli masz białe ikony */
}
</style>
</head>
<body>

<div id="comic-container"></div>

<!-- ===== FLOATING BUTTONS ===== -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="homeBtn">
    <img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon">
  </div>

  <div class="nav-btn" id="nextBtn">
    <img src="https://tajnachalupka.github.io/main/next.png" class="btn-icon">
  </div>
</div>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = Number(params.get("chapter"));

  const container = document.getElementById("comic-container");

  // ===== HOME BUTTON =====
  document.getElementById("homeBtn").onclick = () => {
    window.location.href = "index.html";
  };

  // ===== WALIDACJA =====
  if (!comicKey || !chapter) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    document.getElementById("nextBtn").onclick = () => {
      window.location.href = "index.html";
    };
    return;
  }

  try {
    const res = await fetch(`${comicKey}.json`);
    if (!res.ok) throw new Error("Nie znaleziono JSON");

    const data = await res.json();
    const pages = data.chapters[String(chapter)];

    // ===== jeśli chapter nie istnieje =====
    if (!pages) {
      container.innerHTML =
        "<p style='color:white;text-align:center;padding:50px;'>Ten rozdział nie istnieje.</p>";

      document.getElementById("nextBtn").onclick = () => {
        window.location.href = "index.html";
      };
      return;
    }

    // ===== ŁADOWANIE OBRAZÓW =====
    pages.forEach((src, index) => {
      const img = document.createElement("img");

      let attempts = 0;
      const loadImage = () => {
        img.src = src + (attempts > 0 ? `?retry=${attempts}` : "");
      };

      img.onerror = () => {
        attempts++;
        if (attempts < 3) loadImage();
        else {
          img.style.opacity = "0.4";
          img.style.border = "2px solid red";
          img.alt = "Błąd ładowania";
        }
      };

      if (index !== 0) img.loading = "lazy";
      loadImage();
      container.appendChild(img);
    });

    // ===== NEXT BUTTON =====
    const nextBtn = document.getElementById("nextBtn");
    const total = Object.keys(data.chapters).length;

    if (chapter < total) {
      nextBtn.onclick = () => {
        window.location.href = `reader.html?comic=${comicKey}&chapter=${chapter + 1}`;
      };
    } else {
      nextBtn.onclick = () => {
        window.location.href = "index.html";
      };
    }

  } catch (err) {
    console.error(err);
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Błąd wczytywania pliku JSON.</p>";

    document.getElementById("nextBtn").onclick = () => {
      window.location.href = "index.html";
    };
  }

})();
  
// ===== AUTO-HIDE BUTTONS ON SCROLL =====
let lastScroll = 0;
const nav = document.getElementById("nav");

window.addEventListener("scroll", () => {
  const current = window.scrollY;

  if (current > lastScroll) {
    nav.classList.add("hidden");
  } else {
    nav.classList.remove("hidden");
  }

  lastScroll = current;
});
</script>

</body>
</html>
