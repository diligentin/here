<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Czytnik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="reader">
<div class="wrapper">

  <h1 class="reader-title" id="reader-title">Tytuł — Rozdział X</h1>

  <div id="reader-pages">
    <!-- Strony rozdziału (obrazki) wczyta app.js -->
  </div>

  <!-- REAKCJE: wstawisz swoje obrazki -->
  <div class="reactions">
    <div class="reactions-row">
      <img src="img/reactions/r1.png" data-react="r1" alt="">
      <img src="img/reactions/r2.png" data-react="r2" alt="">
      <img src="img/reactions/r3.png" data-react="r3" alt="">
      <img src="img/reactions/r4.png" data-react="r4" alt="">
      <img src="img/reactions/r5.png" data-react="r5" alt="">
    </div>

    <div class="reaction-counts">
      <div><span id="count-r1">0</span></div>
      <div><span id="count-r2">0</span></div>
      <div><span id="count-r3">0</span></div>
      <div><span id="count-r4">0</span></div>
      <div><span id="count-r5">0</span></div>
    </div>
  </div>

  <!-- PRZYCISKI: HOME + NEXT (obok siebie w jednym rzędzie) -->
  <div class="nav-row">
    <!-- ŚRODEK: powrót na główną – wkleisz swój obrazek -->
    <a id="btn-home" href="index.html">
      <img src="img/home.png" alt="Powrót na główną">
    </a>

    <!-- PRAWA: następny rozdział – wkleisz swój obrazek -->
    <a id="btn-next" href="#">
      <img src="img/next.png" alt="Następny rozdział">
    </a>
  </div>

  <!-- DISQUS – tu wkleisz swój kod dla danego rozdziału -->
  <div id="disqus_thread" style="margin-top:40px;"></div>

</div>

<script src="app.js"></script>
</body>
</html>
