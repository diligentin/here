<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>a first of summers</title>
<style>
  body {
    margin: 0;
    background: #191818ff;
    color: #fff;
    font-family: Avenir Next W1G, sans-serif;;
  }

  .wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .top-section {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .cover {
    flex: 0 0 250px;
  }

  .cover img {
    width: 100%;
    height: auto;
    border: 0px solid #444;
  }

  .description {
    flex: 1;
    min-width: 200px;
  }

  .chapters {
    margin-top: 20px;
  }

  .chapter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chapter-btn {
    width: 42px;
    height: 42px;
    border-radius: 4px;
    border: 0px solid #555;
    background: #111;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    line-height: 42px;
    text-decoration: none;
    transition: background .15s, color .15s;
  }

  .chapter-btn:hover {
    background: #333;
  }

  .chapter-btn.visited {
    color: #8394F4; /* odwiedzony rozdział */
  }

  a.back {
    color: #ccc;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="wrapper">

  <a href="index.html" class="back"> <img src="https://tajnachalupka.github.io/main/home.png"></a>

  <h1 id="title-heading">Afos</h1>

  <div class="top-section">
    <div class="cover">
      <!-- PODMIEŃ NA WŁASNE OKŁADKI W JS LUB TU -->
      <img id="cover-img" src="https://tajnachalupka.github.io/main/cov/!afos.jpg" alt="Okładka">
    </div>
    <div class="description">
      <p id="description-text">
        bla bla mniam mniam
      </p>
    </div>
  </div>

  <div class="chapters">
    <h2>Rozdziały</h2>
    <div class="chapter-buttons" id="chapter-buttons"></div>
  </div>

</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");

  if (!comicKey) {
    document.getElementById("title-heading").textContent = "Brak parametru comic";
    return;
  }

  // Tu możesz zrobić mapę tytułów/okładek/opisów:
  const comicsMeta = {
    "komiks1": {
      title: "Komiks 1",
      cover: "LINK_OKLADKA_KOMIKS1.jpg",
      description: "Hyunsun cośtam"
    },
    "komiks2": {
      title: "Komiks 2",
      cover: "LINK_OKLADKA_KOMIKS2.jpg",
      description: "Opis komiksu 2..."
    }
    // dodaj kolejne...
  };

  const meta = comicsMeta[comicKey] || {
    title: comicKey,
    cover: "LINK_DOMYSLNEJ_OKLADKI.jpg",
    description: "Brak opisu."
  };

  document.getElementById("title-heading").textContent = meta.title;
  document.getElementById("cover-img").src = meta.cover;
  document.getElementById("description-text").textContent = meta.description;

  const chapterButtonsContainer = document.getElementById("chapter-buttons");

  // Załóżmy np. 30 rozdziałów – możesz zmienić:
  const TOTAL_CHAPTERS = 30;

  // Odczyt odwiedzonych rozdziałów z localStorage
  const visitedKey = `visited_${comicKey}`;
  const visited = JSON.parse(localStorage.getItem(visitedKey)) || [];

  function isVisited(ch) {
    return visited.includes(ch);
  }

  function markVisited(ch) {
    if (!visited.includes(ch)) {
      visited.push(ch);
      localStorage.setItem(visitedKey, JSON.stringify(visited));
    }
  }

  for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
    const a = document.createElement("a");
    a.href = `reader.html?comic=${encodeURIComponent(comicKey)}&chapter=${i}`;
    a.textContent = i;
    a.className = "chapter-btn";
    if (isVisited(i)) {
      a.classList.add("visited");
    }

    a.addEventListener("click", () => {
      markVisited(i);
    });

    chapterButtonsContainer.appendChild(a);
  }

})();
</script>
</body>
</html>
